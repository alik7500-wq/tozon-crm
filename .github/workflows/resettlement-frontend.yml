name: Resettlement frontend build
on:
  pull_request:
    paths:
      - 'src/features/resettlement/**'
      - 'src/App.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resettlement-frontend.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
